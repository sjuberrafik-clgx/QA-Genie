<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CBR Fixture — Vision-Ambiguous (DOM-blind controls)</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; }
        .toolbar { display: flex; gap: 10px; align-items: center; }
        .iconbtn { width: 36px; height: 36px; border: 1px solid #ccc; background: #fff; cursor: pointer; }
        .icon-search::before { content: "🔍"; }
        .fa-trash::before { content: "🗑"; }
        .icon-settings::before { content: "⚙"; }
        canvas { border: 1px solid #ddd; display: block; margin-top: 14px; }
        .field { margin-top: 14px; display: flex; align-items: center; gap: 8px; }
    </style>
</head>

<body>
    <!--
      Purpose: every interactive control here is INVISIBLE to the accessibility tree —
      it has no accessible name (no text, no aria-label, no title on the host). These are
      exactly the elements that leave generated tests unable to name or assert a control.
      Vision fusion (Phase 5) should recover a name for each from the visual/secondary cues:
        - icon-class buttons        → from the icon token
        - svg-<title> button        → from the child <svg><title>
        - img-alt button            → from the child <img alt>
        - title-tooltip button      → from the host title attribute
        - canvas                    → from data-label (a real model would read the drawing)
        - adjacent-text control     → from the label rendered beside it
    -->
    <div class="toolbar">
        <!-- 1. Icon-only buttons: name is encoded only in the icon class. -->
        <button class="iconbtn icon-search" aria-hidden="false"></button>
        <button class="iconbtn fa-trash"></button>
        <button class="iconbtn icon-settings"></button>

        <!-- 2. SVG-only button: name is in the child <svg><title>. -->
        <button class="iconbtn" id="svg-btn">
            <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="false">
                <title>Download report</title>
                <path d="M9 2v10M5 8l4 4 4-4" stroke="#333" fill="none" />
            </svg>
        </button>

        <!-- 3. Image-only button: name is in the child <img alt>. -->
        <button class="iconbtn" id="img-btn">
            <img src="data:image/gif;base64,R0lGODlhAQABAAAAACwAAAAAAQABAAA=" alt="Share listing" width="18" height="18" />
        </button>

        <!-- 4. Tooltip-only button: name only in the host title attribute. -->
        <button class="iconbtn" id="tip-btn" title="Add to favorites"></button>
    </div>

    <!-- 5. Canvas chart: opaque to the DOM; data-label is the only textual cue. -->
    <canvas id="price-chart" width="240" height="120" data-label="Price history chart"></canvas>

    <!-- 6. Unlabeled input with adjacent text (visually labeled, programmatically not). -->
    <div class="field">
        <span>Max price</span>
        <input id="bare-input" type="number" />
    </div>

    <script>
        // Draw something on the canvas so it's a real visual region with non-zero content.
        const c = document.getElementById('price-chart');
        if (c && c.getContext) {
            const ctx = c.getContext('2d');
            ctx.strokeStyle = '#0a64c2';
            ctx.beginPath();
            ctx.moveTo(0, 100);
            for (let x = 0; x <= 240; x += 20) ctx.lineTo(x, 100 - Math.abs(Math.sin(x / 30)) * 80);
            ctx.stroke();
        }
    </script>
</body>

</html>
